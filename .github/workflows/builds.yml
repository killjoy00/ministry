name: Build Windows and Linux prototypes

on:
  workflow_dispatch:
  push:
    branches: [prototype-build]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Configure Godot export templates
        run: |
          set -eu
          source=/root/.local/share/godot/export_templates/4.7.2.stable
          destination="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          test -d "$source"
          mkdir -p "$(dirname "$destination")"
          ln -s "$source" "$destination"
      - name: Import
        run: godot --headless --path . --editor --quit
      - name: Check game engine
        run: godot --headless --path . --script res://tests/smoke.gd
      - name: Illustrations and screen identity
        run: godot --headless --path . --script res://tests/art_smoke.gd
      - name: Build Linux (Steam Deck native candidate)
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Linux" build/ministry-of-coincidences-linux.x86_64
      - name: Build Windows (Proton candidate)
        run: godot --headless --path . --export-release "Windows Desktop" build/ministry-of-coincidences-windows.exe
      - name: Upload testable binaries
        uses: actions/upload-artifact@v4
        with:
          name: ministry-prototype-${{ github.run_number }}
          path: build/
          if-no-files-found: error
          retention-days: 14

      # Temporary development utility: the full editor-capable Godot CLI enables
      # local rendered UI checks against the exact CI engine version.
      - name: Export Godot test runtime
        run: |
          mkdir -p devtools
          cp -L "$(command -v godot)" devtools/godot-4.7.2-linux.x86_64
          chmod +x devtools/godot-4.7.2-linux.x86_64
      - name: Upload UI test runtime
        uses: actions/upload-artifact@v4
        with:
          name: ministry-dev-godot-${{ github.run_number }}
          path: devtools/
          retention-days: 1
