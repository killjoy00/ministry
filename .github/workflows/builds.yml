name: Build Windows and Linux prototypes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/builds.yml'
  push:
    branches: [prototype-build, main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Configure Godot export templates
        run: |
          set -eu
          source=/root/.local/share/godot/export_templates/4.7.2.stable
          destination="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          test -d "$source"
          mkdir -p "$(dirname "$destination")"
          ln -s "$source" "$destination"
      - name: Import
        run: godot --headless --path . --editor --quit
      - name: Check game engine
        run: godot --headless --path . --script res://tests/smoke.gd
      - name: Illustrations and screen identity
        run: godot --headless --path . --script res://tests/art_smoke.gd
      - name: Illustrated world and controller gallery
        run: godot --headless --path . --script res://tests/illustrated_smoke.gd
      - name: Layout at Steam Deck resolution
        run: godot --headless --path . --script res://tests/ui_smoke.gd
      - name: Real-engine balance regression
        run: godot --headless --path . --script res://tests/balance.gd
      - name: Build Linux (Steam Deck native candidate)
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Linux" build/ministry-of-coincidences-linux.x86_64
      - name: Build Windows (Proton candidate)
        run: godot --headless --path . --export-release "Windows Desktop" build/ministry-of-coincidences-windows.exe
      - name: Create downloadable Steam Deck and Windows packages
        run: |
          bash tools/package_release.sh
          tar -tzf build/ministry-steam-deck-linux.tar.gz | grep -F 'Play Ministry.sh'
      - name: Upload testable binaries
        uses: actions/upload-artifact@v4
        with:
          name: ministry-prototype-${{ github.run_number }}
          path: build/
          if-no-files-found: error
          retention-days: 14
