name: Godot prototype checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Smoke tests
        run: godot --headless --path . --script res://tests/smoke.gd
      - name: Illustrations and screen identity
        run: godot --headless --path . --script res://tests/art_smoke.gd
      - name: Illustrated world and controller gallery
        run: godot --headless --path . --script res://tests/illustrated_smoke.gd
      - name: 1280x800 interface regression
        run: godot --headless --path . --script res://tests/ui_smoke.gd
      - name: Deterministic balance regression
        run: godot --headless --path . --script res://tests/balance.gd
      - name: Living Oddford and original audio
        run: godot --headless --path . --script res://tests/living_town_smoke.gd
      - name: Recorded character choreography and reduced motion
        run: godot --headless --path . --script res://tests/character_animation_smoke.gd
      - name: Permanent department unlocks and true causal powers
        run: godot --headless --path . --script res://tests/departments_smoke.gd
      - name: 1280x800 department office board
        run: godot --headless --path . --script res://tests/departments_ui_smoke.gd
      - name: Department balance and provenance regression
        run: godot --headless --path . --script res://tests/department_balance.gd
      - name: Escalating assignment contracts and legacy save migration
        run: godot --headless --path . --script res://tests/assignments_smoke.gd
      - name: Case selection, controller focus and 1280x800 goals
        run: godot --headless --path . --script res://tests/assignments_ui_smoke.gd
      - name: Seeded difficulty progression and department value
        run: godot --headless --path . --script res://tests/assignments_balance.gd
      - name: Expanded incident atlas reachability and replay variety
        run: godot --headless --path . --script res://tests/incident_expansion_smoke.gd
      - name: First-day practice and causal dossier regression
        run: godot --headless --path . --script res://tests/onboarding_causality_smoke.gd
