name: iOS Xcode project (unsigned)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/mobile/**'
      - 'scenes/mobile_main.tscn'
      - 'assets/mobile/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/mobile-ios.yml'
permissions:
  contents: read
jobs:
  xcode-project:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 editor and iOS export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://github.com/godotengine/godot/releases/download/4.7.2-stable'
          curl -fsSL --retry 3 "$BASE/Godot_v4.7.2-stable_macos.universal.zip" -o /tmp/godot-macos.zip
          curl -fsSL --retry 3 "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-app /tmp/godot-templates
          unzip -q /tmp/godot-macos.zip -d /tmp/godot-app
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          cp -R /tmp/godot-templates/templates/. "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"
          find /tmp/godot-app -type f -name Godot -maxdepth 8 -exec cp {} /tmp/godot-editor \;
          chmod +x /tmp/godot-editor
          /tmp/godot-editor --headless --path . --editor --quit
      - name: Export unsigned iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          /tmp/godot-editor --headless --path . --export-release 'iOS Xcode Project' build/ios/MinistryOfCoincidences.zip
          test -s build/ios/MinistryOfCoincidences.zip
          unzip -t build/ios/MinistryOfCoincidences.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: ministry-ios-xcode-unsigned-${{ github.run_number }}
          path: build/ios/MinistryOfCoincidences.zip
          retention-days: 14
          if-no-files-found: error
