name: Materialize mobile port source and icons
on:
  push:
    branches: ['mobile/android-ios-beta']
    paths: ['.mobile-source/mobile-payload.xz']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore reviewed source files from compressed transfer
        shell: bash
        run: |
          python - <<'PY'
          import json, lzma
          from pathlib import Path
          payload = Path('.mobile-source/mobile-payload.xz').read_bytes()
          files = json.loads(lzma.decompress(payload).decode('utf-8'))
          for item in files:
              path = Path(item['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(item['content'], encoding='utf-8')
              print('RESTORED', path)
          PY
      - name: Generate platform icons from the existing Ministry seal
        shell: bash
        run: |
          python -m pip install --quiet pillow cairosvg
          python tools/generate_mobile_icons.py
      - name: Commit actual readable game source and icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mobile scenes/mobile_main.tscn tests/mobile_smoke.gd project.godot export_presets.cfg docs/MOBILE_PORT.md .github/workflows/mobile-builds.yml .github/workflows/mobile-ios.yml tools/generate_mobile_icons.py assets/mobile
          if git diff --cached --quiet; then
            echo "Mobile source already present."
          else
            git commit -m "Build Android and iOS touch-first game from tested mobile source"
            git push origin HEAD:mobile/android-ios-beta
          fi
