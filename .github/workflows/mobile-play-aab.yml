name: Google Play Android App Bundle
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/mobile/**'
      - 'scenes/mobile_main.tscn'
      - 'assets/mobile/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/mobile-play-aab.yml'
permissions:
  contents: read

jobs:
  app-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts and Java 17
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends libfontconfig1 fontconfig unzip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Configure SDK and Godot 4.7.2 templates
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35' 'ndk;28.1.13356709' 'cmake;3.10.2.4988404'
          source_dir=/root/.local/share/godot/export_templates/4.7.2.stable
          dest_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          test -s "$source_dir/android_source.zip"
          mkdir -p "$(dirname "$dest_dir")"
          if [ ! -e "$dest_dir" ]; then ln -s "$source_dir" "$dest_dir"; fi
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path="$ANDROID_HOME"
          export/android/java_sdk_path="$JAVA_HOME"
          EOF
          godot --headless --path . --editor --quit
      - name: Prepare stable upload signing or CI-only smoke signing
        shell: bash
        id: signing
        env:
          KEY_B64: ${{ secrets.MINISTRY_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.MINISTRY_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINISTRY_ANDROID_UPLOAD_KEY_ALIAS }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            test -n "$KEY_B64" || { echo "::error::Set MINISTRY_ANDROID_UPLOAD_KEYSTORE_BASE64 in repository secrets"; exit 1; }
            test -n "$KEY_PASSWORD" || { echo "::error::Set MINISTRY_ANDROID_UPLOAD_KEYSTORE_PASSWORD in repository secrets"; exit 1; }
            test -n "$KEY_ALIAS" || { echo "::error::Set MINISTRY_ANDROID_UPLOAD_KEY_ALIAS in repository secrets"; exit 1; }
            printf '%s' "$KEY_B64" | base64 -d > /tmp/ministry-upload.keystore
            chmod 600 /tmp/ministry-upload.keystore
            keytool -list -keystore /tmp/ministry-upload.keystore -alias "$KEY_ALIAS" -storepass "$KEY_PASSWORD" >/dev/null
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "real_upload_key=true" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -noprompt -keystore /tmp/ministry-upload.keystore -alias ci_smoke -storepass androidtest -keypass androidtest -keyalg RSA -keysize 2048 -validity 365 -dname "CN=CI-only bundle,O=Ministry,C=US"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=ci_smoke" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=androidtest" >> "$GITHUB_ENV"
            echo "real_upload_key=false" >> "$GITHUB_OUTPUT"
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/ministry-upload.keystore" >> "$GITHUB_ENV"
      - name: Build and validate Android AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-release 'Android Play AAB' build/ministry-play-upload.aab
          test -s build/ministry-play-upload.aab
          unzip -t build/ministry-play-upload.aab | tail -1
          unzip -l build/ministry-play-upload.aab | grep -F 'base/manifest/AndroidManifest.xml'
      - name: Upload stable signed AAB (manual release only)
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.real_upload_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ministry-google-play-aab-${{ github.run_number }}
          path: build/ministry-play-upload.aab
          if-no-files-found: error
          retention-days: 14
